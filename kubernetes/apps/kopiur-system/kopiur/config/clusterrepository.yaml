---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: pilot
spec:
  backend:
    filesystem:
      path: /repository
      volume:
        nfs:
          server: 192.168.10.98
          path: /mnt/rust/volsync/kopiur-pilot
  encryption:
    passwordSecretRef:
      name: kopiur-pilot-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  create:
    enabled: true
  allowedNamespaces:
    list:
      - media
  maintenance:
    namespace: kopiur-system
  moverDefaults:
    # NFS export is root-squashed and owned 568:568 (volsync convention)
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
