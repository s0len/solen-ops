---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app etcd-defrag
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3

  values:
    controllers:
      etcd-defrag:
        type: cronjob
        cronjob:
          schedule: "47 4 1 * *"
          timeZone: ${TIMEZONE}
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          backoffLimit: 0
          # A failed Job that never ages out keeps KubeJobFailed firing forever.
          ttlSecondsAfterFinished: 604800
          activeDeadlineSeconds: 1800
        containers:
          app:
            image:
              repository: public.ecr.aws/docker/library/alpine
              tag: "3.24"
            command: ["/bin/sh", "/scripts/defrag.sh"]
            env:
              ETCD_NODES: "192.168.10.40 192.168.10.41 192.168.10.42"
              DEFRAG_RATIO_MAX: "50"
              DEFRAG_MIN_DB_MB: "100"
              DEFRAG_SETTLE_SECONDS: "60"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

    persistence:
      scripts:
        type: configMap
        name: etcd-defrag-configmap
        defaultMode: 0755
        globalMounts:
          - path: /scripts/defrag.sh
            subPath: defrag.sh
            readOnly: true
      talosctl:
        type: image
        image:
          repository: ghcr.io/siderolabs/talosctl
          tag: ${TALOS_VERSION}
        pullPolicy: IfNotPresent
        globalMounts:
          - path: /opt/talos
      talos-secrets:
        type: secret
        name: *app
        globalMounts:
          - path: /var/run/secrets/talos.dev
            readOnly: true
