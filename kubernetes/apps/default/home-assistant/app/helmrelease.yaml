---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-assistant
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: home-assistant
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # The venv on the cache claim outlives the image. When the image
          # changes it keeps whatever the previous version resolved, and a
          # venv package shadows the image's own copy: a stale
          # bleak-retry-connector 4.6.3 against 2026.9.1 removed the symbol
          # habluetooth imports and Home Assistant would not start at all.
          # Rebuild the venv whenever the image reference changes.
          venv-guard:
            image: &appImage
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.9.2@sha256:83decfe1f940120bd7ecbb2c7d72d5b2723dfddb39de3f4e9914c19ead1f721f
            command: ["/bin/sh", "-c"]
            # Every shell variable below is doubled. Flux runs envsubst over
            # this file to fill its own substitutions, and in strict mode a
            # shell variable it cannot resolve fails the whole Kustomization,
            # which is how this guard stalled on its first attempt.
            args:
              - |
                set -eu
                stamp=/config/.venv-image-stamp
                # Fingerprint the image's own installed distributions rather
                # than the tag: no version string to keep in step with
                # Renovate, and a digest-only rebuild that moves a dependency
                # is caught just as a version bump is.
                want="$$(python -c "import importlib.metadata as m, hashlib; print(hashlib.sha256(repr(sorted((d.metadata['Name'] or '', d.version) for d in m.distributions())).encode()).hexdigest())")"
                have="$$(cat "$$stamp" 2>/dev/null || true)"
                if [ "$$have" = "$$want" ]; then
                  echo "venv matches the image's packages ($$want)"
                  exit 0
                fi
                echo "image packages changed $${have:-none} -> $${want}; rebuilding the venv"
                find /venv -mindepth 1 -maxdepth 1 ! -name lost+found -exec rm -rf {} +
                printf '%s' "$$want" > "$$stamp"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi

        containers:
          app:
            image: *appImage
            env:
              TZ: ${TIMEZONE}
              HASS_HTTP_TRUSTED_PROXY_1: 10.69.0.0/16
              HASS_HTTP_TRUSTED_PROXY_2: 10.96.0.0/16
            envFrom:
              - secretRef:
                  name: home-assistant-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
          code-server:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.137.0@sha256:57ac684d44deb6fa94317b3e8f3e128dd7fb897fffd95b4efcd16f56ce607971
            env:
              HOME: /tmp/code-server
            args:
              - --auth
              - none
              - --user-data-dir
              - /tmp/code-server
              - --extensions-dir
              - /tmp/code-server/extensions
              - --bind-addr
              - 0.0.0.0:8443
              - /config
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      hostNetwork: true
      nodeSelector:
        kubernetes.io/hostname: control-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8123
      code-server:
        controller: *app
        ports:
          http:
            port: 8443
      lb:
        controller: *app
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${HOMEASSISTANT_LB_IP}
        externalTrafficPolicy: Local
        ports:
          http:
            port: 8123
          coiot:
            port: 5683
            protocol: UDP
    route:
      app:
        hostnames:
          - "hass.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
      code-server:
        hostnames:
          - "hass-code.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: code-server
                port: http
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      config-cache:
        existingClaim: home-assistant-cache
        advancedMounts:
          home-assistant:
            app:
              - path: /config/.venv
            venv-guard:
              - path: /venv
      tmp:
        type: emptyDir
        advancedMounts:
          home-assistant:
            app:
              - path: /tmp
      code-server-tmp:
        type: emptyDir
        advancedMounts:
          home-assistant:
            code-server:
              - path: /tmp/code-server
