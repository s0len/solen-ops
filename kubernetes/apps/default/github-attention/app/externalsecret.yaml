---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-attention-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: github-attention-secret
    template:
      data:
        # GitHub PAT. Reuses the flux item's token (scope: repo, read access is
        # all this job needs). Swap to a dedicated fine-grained read-only PAT if
        # you ever want to narrow it -- nothing else here changes.
        GITHUB_TOKEN: "{{ .FLUX_GITHUB_TOKEN }}"
        # Pushover. GITHUB_TOKEN on the pushover item is the Pushover *app*
        # token, unrelated to the PAT above -- the rewrite prefixes keep them
        # from colliding.
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
        PUSHOVER_API_TOKEN: "{{ .PUSHOVER_GITHUB_TOKEN }}"
  dataFrom:
    - extract:
        key: flux
      rewrite:
        - regexp:
            source: "(.*)"
            target: "FLUX_$1"

    - extract:
        key: pushover
      rewrite:
        - regexp:
            source: "(.*)"
            target: "PUSHOVER_$1"
