---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app netronome
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      netronome:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
            envFrom: &envFrom
              - secretRef:
                  name: netronome-secret
        containers:
          app:
            image:
              repository: ghcr.io/autobrr/netronome
              tag: v0.11.0@sha256:3d7232208d7bd61acd25d25b4b6de5f807b2362515dd403f5adffe74e7c3ff61
            env:
              TZ: ${TIMEZONE}
              NETRONOME__DB_TYPE: postgres
              NETRONOME__HOST: 0.0.0.0
              NETRONOME__PORT: &port 7575
              NETRONOME__OIDC_ISSUER: "https://idm.${SECRET_DOMAIN}/oauth2/openid/netronome"
              NETRONOME__OIDC_REDIRECT_URL: "https://speedtest.${SECRET_DOMAIN}/api/auth/oidc/callback"
              NETRONOME__OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-netronome-oidc
                    key: client-id
              NETRONOME__OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-netronome-oidc
                    key: client-secret
              NETRONOME__IPERF_TEST_DURATION: "10"
              NETRONOME__IPERF_PARALLEL_CONNS: "4"
              NETRONOME__PACKETLOSS_ENABLED: "true"
              NETRONOME__PACKETLOSS_PRIVILEGED_MODE: "true"
              NETRONOME__PACKETLOSS_DEFAULT_INTERVAL: "3600"
              NETRONOME__PACKETLOSS_RESTORE_MONITORS_ON_STARTUP: "true"
              NETRONOME__MONITOR_ENABLED: "true"
            envFrom: *envFrom
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                add: ["NET_RAW"]
                drop: ["ALL"]
            resources:
              requests:
                cpu: 5m
                memory: 50Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "speedtest.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        advancedMounts:
          netronome:
            app:
              - path: /tmp
