---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-secret
    template:
      data:
        ALERTMANAGER_PUSHOVER_TOKEN: "{{ .PUSHOVER_ALERTMANAGER_TOKEN }}"
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
        ALERTMANAGER_HEARTBEAT_URL: "{{ .HEALTHCHECKS_ALERTMANAGER_PING_URL }}"
  dataFrom:
    - extract:
        key: pushover
      rewrite:
        - regexp:
            source: "(.*)"
            target: "PUSHOVER_$1"
    - extract:
        key: healthchecks
      rewrite:
        - regexp:
            source: "(.*)"
            target: "HEALTHCHECKS_$1"
