---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ciliumnetworkpolicy.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./prometheusrule.yaml
  - ./pvc.yaml
  - ./rbac.yaml
configMapGenerator:
  - name: alert-agent-configmap
    files:
      - gate.py=./scripts/gate.py
  - name: alert-agent-hermes-configmap
    files:
      - hermes-config.yaml=./resources/hermes-config.yaml
      - hermes-config-render.sh=./resources/hermes-config-render.sh
      - hermes-cron-bootstrap.sh=./resources/hermes-cron-bootstrap.sh
      - hermes-fix-prompt.md=./resources/hermes-fix-prompt.md
      - hermes-heartbeat.sh=./resources/hermes-heartbeat.sh
      - hermes-prune.sh=./resources/hermes-prune.sh
      - hermes.env.example=./resources/hermes.env.example
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
