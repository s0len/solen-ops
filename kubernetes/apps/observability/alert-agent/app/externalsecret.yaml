---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alert-agent-github
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alert-agent-github-secret
    template:
      data:
        # Machine account: fine-grained token scoped to solen-ops and the
        # Incidents Repo. GITHUB_USER is unused by the Gate; Hermes takes it.
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
        GITHUB_USER: "{{ .GITHUB_USER }}"
  dataFrom:
    - extract:
        key: alert-agent
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: alert-agent-webhook
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alert-agent-webhook
spec:
  # Generated once and shared with Hermes in the same pod; do not refresh.
  refreshInterval: "0"
  target:
    name: alert-agent-webhook-secret
    template:
      data:
        HERMES_WEBHOOK_SECRET: "{{ .WEBHOOK_SECRET }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: alert-agent-webhook
      rewrite:
        - regexp:
            source: "password"
            target: "WEBHOOK_SECRET"
