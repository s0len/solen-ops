---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alert-remediator-etcd-defrag
  namespace: kube-system
rules:
  # Starting the reviewed etcd-defrag CronJob early. `get` on that one CronJob
  # is what `kubectl create job --from=cronjob/etcd-defrag` reads its template
  # from; the Job it then creates is bounded by name and by owner in the
  # ValidatingAdmissionPolicy. pods/log is for the evidence the Remediator
  # pastes onto the Incident Issue.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["etcd-defrag"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alert-remediator-etcd-defrag
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alert-remediator-etcd-defrag
subjects:
  - kind: ServiceAccount
    name: alert-remediator
    namespace: observability
