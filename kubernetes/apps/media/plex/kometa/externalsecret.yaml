---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name kometa-secret
spec:
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  refreshInterval: 1m
  target:
    name: *name
    template:
      data:
        KOMETA_MDBLIST_API_KEY: "{{ .KOMETA_MDBLIST_API_KEY }}"
        KOMETA_OMDB_API_KEY: "{{ .KOMETA_OMDB_API_KEY }}"
        KOMETA_TMDB_API_KEY: "{{ .KOMETA_TMDB_API_KEY }}"

        KOMETA_NOTIFIARR_API_KEY: "{{ .NOTIFIARR_KOMETA_API_KEY }}"

        KOMETA_PLEX_API_KEY: "{{ .PLEX_TOKEN }}"

        KOMETA_TAUTULLI_API_KEY: "{{ .TAUTULLI_API_KEY }}"

        KOMETA_RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
  dataFrom:
    - extract:
        key: kometa
      rewrite:
        - regexp:
            source: "(.*)"
            target: "KOMETA_$1"

    - extract:
        key: plex
      rewrite:
        - regexp:
            source: "(.*)"
            target: "PLEX_$1"

    - extract:
        key: tautulli
      rewrite:
        - regexp:
            source: "(.*)"
            target: "TAUTULLI_$1"

    - extract:
        key: notifiarr
      rewrite:
        - regexp:
            source: "(.*)"
            target: "NOTIFIARR_$1"

    - extract:
        key: radarr
      rewrite:
        - regexp:
            source: "(.*)"
            target: "RADARR_$1"
