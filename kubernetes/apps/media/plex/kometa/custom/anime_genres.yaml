# Based on https://github.com/KenWeTech/KAC-Files (Genres.yml, commit 2e8d4c756d62), builders converted from MyAnimeList to AniList.
# Covers are loaded from the upstream repo's raw URLs.

templates:
  Chart:
    collection_order: custom
    sync_mode: sync
    sort_title: '!015_<<collection_name>>'
    summary: Animes that are currently <<summary_text>> on AniList.
    url_poster: https://raw.githubusercontent.com/KenWeTech/KAC-Files/main/Covers/<<cover>>
  Genre:
    anilist_search:
      genre: <<genre>>
      sort_by: popular
      limit: 500
    cache_builders: 7
    url_poster: https://raw.githubusercontent.com/KenWeTech/KAC-Files/main/Covers/Genres/<<cover>>
    collection_order: alpha
    collection_mode: hide
    sync_mode: sync
    sort_title: zzz++_<<collection_name>>
    summary: Animes that are in the <<collection_name>> category/genre.
  Tag:
    anilist_search:
      tag: <<tag>>
      min_tag_percent: 50
      sort_by: popular
      limit: 500
    cache_builders: 7
    url_poster: https://raw.githubusercontent.com/KenWeTech/KAC-Files/main/Covers/Genres/<<cover>>
    collection_order: alpha
    collection_mode: hide
    sync_mode: sync
    sort_title: zzz++_<<collection_name>>
    summary: Animes that are in the <<collection_name>> category/genre.
  Header:
    url_poster: https://raw.githubusercontent.com/KenWeTech/KAC-Files/main/Covers/Genres/<<cover>>
    collection_mode: hide
    blank_collection: true
    sync_mode: sync
    sort_title: zzz++_A_<<collection_name>>
    summary: Animes that are separated by category/genre.
  Special:
    url_poster: https://raw.githubusercontent.com/KenWeTech/KAC-Files/main/Covers/Genres/<<cover>>
    collection_order: alpha
    collection_mode: hide
    sync_mode: sync
    sort_title: zzz++_<<collection_name>>
    summary: Animes that are in the <<collection_name>> category/genre.

collections:

  Top Airing Anime:
    template: {name: Chart, summary_text: "the top airing", cover: "MAL-Top-Airing.jpg"}
