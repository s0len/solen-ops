#######################
##     Templates     ##
#######################

templates:
  Anime Season:
    url_poster: https://raw.githubusercontent.com/KenWeTech/KAC-Files/main/Covers/Seasons/<<year>>/<<season>>.jpg
    mal_season:
      season: <<season_lower>>
      year: <<year>>
      limit: 500
      sort_by: members
    sync_mode: sync
    sort_title: zzzz_Season_<<sort_order>>_<<season_index>>_<<year>>
    summary: Anime airing during the <<season_lower>> anime season in <<year>>.
    collection_order: release
  Seasons:
    url_poster: https://raw.githubusercontent.com/KenWeTech/KAC-Files/main/Covers/Seasons/<<cover>>
    collection_mode: hide
    blank_collection: true
    sync_mode: sync
    sort_title: zzzz_Season_<<sort_order>>
    summary: Animes airing during the specified season and year.

#############################
##       Collections       ##
#############################

collections:

  Anime This Season:
    sort_title: '!000_Anime This Season'
    mal_season:
      sort_by: members
      starting_only: False
      limit: 500
    summary: Anime that is airing/returning this season only. For older seasons please check the bottom of collections for them.
    sync_mode: sync
    visible_home: true
    visible_library: true
    url_poster: https://raw.githubusercontent.com/KenWeTech/KAC-Files/main/Covers/Seasons/Anime-This-Season.jpg

