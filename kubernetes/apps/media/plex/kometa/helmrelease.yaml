---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kometa
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: plex
      namespace: media
    - name: openebs
      namespace: openebs-system
    - name: volsync
      namespace: volsync-system

  values:
    controllers:
      main:
        type: &type cronjob
        cronjob: &cronjob
          # after midnight UTC so the MDBList daily quota is fresh for the whole run
          schedule: "23 2 * * *"
          timeZone: &timeZone ${TIMEZONE}
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app: &container_app
            image:
              repository: kometateam/kometa
              tag: develop@sha256:28cc2038e08fee67e551f0bbb67fa7eb98b156a54e54c8cfdd25ebd68dfe27d7
            command:
              - /bin/sh
              - -c
            args:
              - |
                python3 kometa.py --run --read-only-config
            env:
              TZ: *timeZone
              KOMETA_CONFIG: /config/config-main.yaml
            envFrom:
              - secretRef:
                  name: kometa-secret
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

      standard-series:
        type: *type
        cronjob:
          <<: *cronjob
          schedule: "40 */3 * * *" # every 3 hours
        containers:
          app:
            <<: *container_app
            args:
              - |
                python3 kometa.py --run --read-only-config --overlays-only --run-libraries "Serier"
            env:
              TZ: *timeZone
              KOMETA_CONFIG: /config/config-standard-series.yaml

      standard-movies:
        type: *type
        cronjob:
          <<: *cronjob
          schedule: "10 */3 * * *" # every 3 hours
        containers:
          app:
            <<: *container_app
            args:
              - |
                python3 kometa.py --run --read-only-config --overlays-only --run-libraries "Filmer"
            env:
              TZ: *timeZone
              KOMETA_CONFIG: /config/config-standard-movies.yaml

      anime-series:
        type: *type
        cronjob:
          <<: *cronjob
          schedule: "20 */3 * * *" # every 3 hours
        containers:
          app:
            <<: *container_app
            args:
              - |
                python3 kometa.py --run --read-only-config --overlays-only --run-libraries "Animeserier"
            env:
              TZ: *timeZone
              KOMETA_CONFIG: /config/config-anime-series.yaml

      anime-movies:
        type: *type
        cronjob:
          <<: *cronjob
          schedule: "30 */3 * * *" # every 3 hours
        containers:
          app:
            <<: *container_app
            args:
              - |
                python3 kometa.py --run --read-only-config --overlays-only --run-libraries "Animefilmer"
            env:
              TZ: *timeZone
              KOMETA_CONFIG: /config/config-anime-movies.yaml

      # sport:
      #   type: *type
      #   cronjob:
      #     <<: *cronjob
      #     ttlSecondsAfterFinished: 7200
      #     schedule: "16 1,9 * * *"
      #   containers:
      #     app:
      #       <<: *container_app
      #       args:
      #         - |
      #           python3 kometa.py --run --read-only-config --run-libraries "Sport"

      asset-shell:
        type: deployment
        replicas: 0
        containers:
          app:
            <<: *container_app
            command:
              - sleep
            args:
              - infinity
            env:
              TZ: *timeZone
              KOMETA_CONFIG: /config/config.yaml

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: Always

    persistence:
      assets:
        existingClaim: kometa-assets
        globalMounts:
          - path: /config/assets

      config:
        existingClaim: *app

      config-file:
        type: configMap
        name: kometa-configmap
        advancedMounts:
          main:
            app:
              - path: /config/config-main.yaml
                subPath: config.yaml
                readOnly: true
          standard-series:
            app:
              - path: /config/config-standard-series.yaml
                subPath: config.yaml
                readOnly: true
          standard-movies:
            app:
              - path: /config/config-standard-movies.yaml
                subPath: config.yaml
                readOnly: true
          anime-series:
            app:
              - path: /config/config-anime-series.yaml
                subPath: config.yaml
                readOnly: true
          anime-movies:
            app:
              - path: /config/config-anime-movies.yaml
                subPath: config.yaml
                readOnly: true
          asset-shell:
            app:
              - path: /config/config.yaml
                subPath: config.yaml
                readOnly: true

      logs:
        type: emptyDir
        globalMounts:
          - path: /config/logs

      data:
        type: nfs
        server: ${TRUENAS_IP}
        path: /mnt/rust/data/media
        globalMounts:
          - path: /data/media
            readOnly: false

      custom-configs:
        type: configMap
        name: kometa-custom-configs
        globalMounts:
          - path: /config/anime_genres.yaml
            subPath: anime_genres.yaml
            readOnly: true
          - path: /config/anime_seasons.yaml
            subPath: anime_seasons.yaml
            readOnly: true
          - path: /config/best-of.yaml
            subPath: best-of.yaml
            readOnly: true
          - path: /config/movies_collections.yaml
            subPath: movies_collections.yaml
            readOnly: true
          - path: /config/series_collections.yaml
            subPath: series_collections.yaml
            readOnly: true
          - path: /config/tag_dv_mel_fel.yaml
            subPath: tag_dv_mel_fel.yaml
            readOnly: true
