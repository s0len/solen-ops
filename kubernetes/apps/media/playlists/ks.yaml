---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app playlists
  namespace: &namespace media
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/gatus/external
  # No dependsOn for onepassword: this app ships ZERO secrets. It holds no
  # credential of its own — the person's own Navidrome login is the authorization.
  # That is a deliberate deviation from the namespace convention, not an omission.
  dependsOn:
    - name: tunesynctool
      namespace: media
  path: ./kubernetes/apps/media/playlists/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      GATUS_PATH: /healthz
