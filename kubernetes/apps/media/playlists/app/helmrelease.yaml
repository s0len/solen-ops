---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app playlists
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      playlists:
        # replicas: 1 is LOAD-BEARING. Sessions, jobs, the login throttle and the
        # library index all live in this process. A second replica would not fail
        # loudly — it would just log people out at random and rebuild the index
        # twice.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/library/python
              tag: 3.12-slim
            # stdlib only: no pip, no venv, no image build, nothing to install at
            # start. Pinned to 3.12 to match tunesynctool, whose matcher.py and
            # filesync.py this app imports from /shared.
            command: ["python3", "-u", "/src/server.py"]
            env:
              TZ: ${TIMEZONE}
              PORT: &port 8080
              TRUSTED_ORIGIN: https://playlists.${SECRET_DOMAIN}
              NAVIDROME_URL: http://navidrome.media.svc.cluster.local
              NAVIDROME_PORT: "4533"
              SUBSONIC_CLIENT: playlist-import
              PYTHONPATH: /shared
              PYTHONDONTWRITEBYTECODE: "1"
              PYTHONUNBUFFERED: "1"
              HOME: /tmp
              TMPDIR: /tmp
              WEB_DIR: /web
              INDEX_PAGE: "5000"
              INDEX_FRESH_TTL: "900"
              INDEX_STALE_TTL: "21600"
              SESSION_TTL: "1200"
              SESSION_MAX: "3600"
              JOB_TTL: "900"
              MAX_UPLOAD_BYTES: "8388608"
              MAX_TRACKS: "2000"
              MAX_PLAYLISTS: "20"
              LOGIN_FAIL_LIMIT: "5"
              LOGIN_FAIL_WINDOW: "900"
              LOGIN_GLOBAL_FAIL_LIMIT: "20"
              LOGIN_DELAY_MS: "400"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /healthz, port: *port }
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /healthz, port: *port }
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /healthz, port: *port }
                  periodSeconds: 3
                  failureThreshold: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    # No `route:` block — the HTTPRoute is a separate file so it can carry the
    # header-stripping filter, and so its name is explicit (the no-auth
    # SecurityPolicy targets it by name).
    persistence:
      src:
        type: configMap
        name: playlists-src
        defaultMode: 0555
        globalMounts:
          - path: /src
            readOnly: true
      web:
        type: configMap
        name: playlists-web
        defaultMode: 0555
        globalMounts:
          - path: /web
            readOnly: true
      # matcher.py + filesync.py live in tunesynctool's ConfigMap and are imported
      # from here via PYTHONPATH=/shared. One source of truth for matching across
      # three consumers; editing them rolls both pods.
      shared:
        type: configMap
        name: tunesynctool-scripts
        defaultMode: 0555
        globalMounts:
          - path: /shared
            readOnly: true
      tmp:
        type: emptyDir
        sizeLimit: 64Mi
        globalMounts:
          - path: /tmp
