---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: playlists
spec:
  hostnames:
    - "playlists.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - filters:
        # Every one of these is attacker-settable through this gateway today:
        # X-Real-IP is rewritten by the gateway's own patch policy from the
        # LEFTMOST X-Forwarded-For entry, and X-Forwarded-Proto is passed through
        # verbatim (a client can send "http"). Nothing in the app reads them, and
        # stripping them here means nothing ever can by accident.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-Real-IP
              - True-Client-IP
              - CF-Connecting-IP
              - X-Forwarded-Proto
      backendRefs:
        - name: playlists
          port: 8080
