---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app navidrome
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      navidrome:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/navidrome/navidrome
              tag: 0.63.2@sha256:9012939114fbb1bb641b81cf96dec5ded15f0aafefe8d47a511d7cb919658e40
            env:
              TZ: ${TIMEZONE}
              ND_MUSICFOLDER: /music
              ND_DATAFOLDER: /data
              ND_PORT: &port 4533
              ND_SCANNER_SCHEDULE: 1h
              ND_SCANNER_PURGEMISSING: never
              ND_SESSIONTIMEOUT: 24h
              ND_ENABLESHARING: "false"
              ND_ENABLETRANSCODINGCONFIG: "false"
              ND_TRANSCODINGCACHESIZE: "5GB"
              ND_IMAGECACHESIZE: "500MB"
              ND_ENABLEINSIGHTSCOLLECTOR: "false"
              ND_LASTFM_ENABLED: "true"
              ND_LISTENBRAINZ_ENABLED: "true"
              ND_BACKUP_PATH: /data/backup
              ND_BACKUP_SCHEDULE: "0 4 * * *"
              ND_BACKUP_COUNT: "7"
            envFrom:
              - secretRef:
                  name: navidrome-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
      music:
        type: nfs
        server: ${TRUENAS_IP}
        path: /mnt/rust/data/media/musik
        globalMounts:
          - path: /music
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
