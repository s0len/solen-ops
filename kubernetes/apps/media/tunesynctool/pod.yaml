---
# Throwaway pod for ad-hoc Spotify -> Navidrome playlist imports via tunesynctool.
# NOT managed by Flux (lives outside ./app, so it is not part of the kustomization).
# Manual use only:  kubectl apply -f pod.yaml   /   kubectl delete -f pod.yaml
# See README.md for the full runbook.
apiVersion: v1
kind: Pod
metadata:
  name: tunesync
  namespace: media
spec:
  restartPolicy: Never
  containers:
    - name: tunesync
      image: python:3.12-slim
      command: ["sleep", "36000"]
      envFrom:
        - secretRef:
            name: tunesynctool-secret
