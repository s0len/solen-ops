---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app beets
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: openebs
      namespace: openebs-system
    - name: volsync
      namespace: volsync-system

  values:
    controllers:
      beets:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: lscr.io/linuxserver/beets
              tag: 2.12.0-ls339@sha256:1da97d79bc39a002ca32099ddf9e3a94a3f6809c9a661e079691701ecc1bf67e
            env:
              PUID: "568"
              PGID: "568"
              UMASK: "022"
              TZ: ${TIMEZONE}
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 6Gi

      import:
        type: cronjob
        annotations:
          reloader.stakater.com/auto: "true"

        cronjob:
          # Early enough that the Pushover summary is waiting at breakfast, late
          # enough to clear the 03:45 volsync snapshot of this same claim.
          schedule: "0 6 * * *"
          timeZone: ${TIMEZONE}
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          backoffLimit: 0
          activeDeadlineSeconds: 18000

        pod:
          # The image ships abc as uid 911; only the s6 init remaps it to PUID,
          # and overriding the command skips that. Set the ids here instead, or
          # everything under /config is unwritable.
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch

          # library.db lives on the RWO beets claim, so this has to land on the
          # node already running the deployment or it will never schedule.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: beets
                      app.kubernetes.io/controller: beets
                  topologyKey: kubernetes.io/hostname

        containers:
          app:
            image:
              repository: lscr.io/linuxserver/beets
              tag: 2.12.0-ls339@sha256:1da97d79bc39a002ca32099ddf9e3a94a3f6809c9a661e079691701ecc1bf67e
            command:
              - /bin/bash
              - /scripts/nightly-import.sh
            env:
              BEETSDIR: /config
              HOME: /config
              TZ: ${TIMEZONE}
            envFrom:
              # optional so the job still runs before BEETS_TOKEN exists in the
              # pushover item; the script just skips the notification.
              - secretRef:
                  name: beets-secret
                  optional: true
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 4Gi

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch

    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config

      config-file:
        type: configMap
        name: beets-configmap
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true

      import-files:
        type: configMap
        name: beets-import-configmap
        globalMounts:
          - path: /config/import-overlay.yaml
            subPath: import-overlay.yaml
            readOnly: true
          - path: /scripts/nightly-import.sh
            subPath: nightly-import.sh
            readOnly: true

      data:
        type: nfs
        server: ${TRUENAS_IP}
        path: /mnt/rust/data
        globalMounts:
          - path: /data
            readOnly: false
