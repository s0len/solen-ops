---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: beets-configmap
    files:
      - ./config/config.yaml
  - name: beets-import-configmap
    files:
      - ./config/import-overlay.yaml
      - nightly-import.sh=./scripts/nightly-import.sh
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
