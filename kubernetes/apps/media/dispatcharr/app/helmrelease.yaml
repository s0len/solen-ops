---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dispatcharr
spec:
  interval: 30m
  # gluetun's startup probe alone allows ~5m10s, over the default 5m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn:
    - name: generic-device-plugin
      namespace: kube-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
  values:
    controllers:
      dispatcharr:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: dispatcharr-gpu
        initContainers:
          # Strip eth0's IPv6 state so gluetun stops keeping unreachable v6
          # endpoints in its reconnect pool (renders before gluetun)
          disable-ipv6:
            image: &gluetun-image
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3
            command:
              - /bin/sh
              - -c
              - |
                ip -6 addr flush dev eth0
                ip -6 route flush dev eth0 table main
                ip -6 route del multicast ff00::/8 dev eth0 table local
                ip -6 route show table all
                true
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
              allowPrivilegeEscalation: false
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18
            envFrom: &envFrom
              - secretRef:
                  name: dispatcharr-secret
          init-permissions:
            image:
              repository: alpine
              tag: 3.24
            command:
              - /bin/sh
              - -c
              - mkdir -p /data/db && chmod 0700 /data/db && chown 1000:1000 /data/db
          gluetun:
            image: *gluetun-image
            env:
              DNS_ADDRESS: "10.96.0.10"
              DOT: "off"
              FIREWALL_INPUT_PORTS: 9191,9999
              FIREWALL_OUTBOUND_SUBNETS: 10.69.0.0/16,10.96.0.0/16
              HEALTH_SERVER_ADDRESS: :9999
              HEALTH_TARGET_ADDRESS: cloudflare.com:443
              VPN_TYPE: wireguard
              VPN_INTERFACE: tun0
              VPN_SERVICE_PROVIDER: airvpn
              WIREGUARD_MTU: 1420
              # Zurich only — must stay disjoint from qbittorrent's Stockholm
              # set, both share one AirVPN peer key. SERVER_CITIES is declared
              # to overwrite untracked drift left on the live Deployment.
              SERVER_CITIES: Zurich
              SERVER_NAMES: Dorado,Sirrah,Toliman
            envFrom:
              - secretRef:
                  name: dispatcharr-secret
            probes:
              # Deadlock protection only — gluetun self-heals the tunnel every
              # ~6s, a kubelet kill just adds startup churn
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  timeoutSeconds: 10
                  periodSeconds: 30
                  failureThreshold: 10
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 30
            restartPolicy: Always
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
              allowPrivilegeEscalation: false
            lifecycle:
              postStart:
                exec:
                  command:
                    [
                      "/bin/sh",
                      "-c",
                      "(ip rule del table 51820; ip -6 rule del table 51820) || true",
                    ]
            resources:
              limits:
                kernel.org/tun: 1
        containers:
          app:
            image:
              repository: ghcr.io/dispatcharr/dispatcharr
              tag: 0.30.0@sha256:e764cd3fb3a4b14e0c96eeb830cce645b44ef0a2494838e21462c71dde5abeb4
            env:
              TZ: ${TIMEZONE}
              REDIS_HOST: dragonfly.database.svc.cluster.local
              CELERY_BROKER_URL: redis://dragonfly.database.svc.cluster.local:6379/0
              DISPATCHARR_LOG_LEVEL: INFO
            envFrom: *envFrom
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 9191
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      data:
        existingClaim: dispatcharr
        globalMounts:
          - path: /data
      profile:
        type: emptyDir
        globalMounts:
          - path: /etc/profile.d
