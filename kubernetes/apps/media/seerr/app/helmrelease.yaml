---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app seerr
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: seerr
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: plex
      namespace: media
    - name: openebs
      namespace: openebs-system
    - name: volsync
      namespace: volsync-system

  values:
    controllers:
      seerr:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18
            envFrom: &envFrom
              - secretRef:
                  name: seerr-secret
          # Guards the MediaSubscriber.js override below: fails the rollout if an
          # image bump changed the upstream file we patch (see resources/MediaSubscriber.js)
          check-subscriber-patch:
            image: &seerrImage
              repository: ghcr.io/seerr-team/seerr
              tag: v3.4.1@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
            command:
              - /bin/sh
              - -c
              - echo '53fc6b30e0f7e7238c673a8782ac68e2d6fbd1f56cb2e32815b058e6da520b16  /app/dist/subscriber/MediaSubscriber.js' | sha256sum -c
        containers:
          app:
            image: *seerrImage
            env:
              TZ: ${TIMEZONE}
              LOG_LEVEL: "debug"
              PORT: &port 80
              # Database configuration via environment variables
              DB_TYPE: postgres
            envFrom: *envFrom
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 5Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "request.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https

    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /app/config

      cache:
        existingClaim: seerr-cache
        globalMounts:
          - path: /app/config/cache

      # Patched MediaSubscriber: defers request-completion to afterTransactionCommit
      # so MEDIA_AVAILABLE notifications survive Postgres READ COMMITTED visibility
      patched-subscriber:
        type: configMap
        name: seerr-patched-subscriber
        advancedMounts:
          seerr:
            app:
              - path: /app/dist/subscriber/MediaSubscriber.js
                subPath: MediaSubscriber.js
                readOnly: true

      logs:
        type: emptyDir
        globalMounts:
          - path: /app/config/logs

      tmp:
        type: emptyDir
        medium: Memory
