---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpackerr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unpackerr-secret
    template:
      data:
        UN_RADARR_standard_API_KEY: "{{ .RADARR_API_KEY}}"
        UN_RADARR_kids_API_KEY: "{{ .RADARR_API_KEY}}"
        UN_RADARR_anime_API_KEY: "{{ .RADARR_API_KEY}}"
        UN_SONARR_main_API_KEY: "{{ .SONARR_API_KEY }}"
        UN_WEBHOOK_notifiarr_URL: "{{ .NOTIFIARR_UNPACKERR_WEBHOOK_URL }}"
  dataFrom:
    - extract:
        key: radarr
      rewrite:
        - regexp:
            source: "(.*)"
            target: "RADARR_$1"

    - extract:
        key: sonarr
      rewrite:
        - regexp:
            source: "(.*)"
            target: "SONARR_$1"

    - extract:
        key: notifiarr
      rewrite:
        - regexp:
            source: "(.*)"
            target: "NOTIFIARR_$1"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: unpackerr-metrics
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpackerr-metrics
spec:
  refreshInterval: "0"
  target:
    name: unpackerr-metrics-secret
    template:
      data:
        UN_WEBSERVER_API_KEYS_0_KEY: "{{ .API_KEY }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: unpackerr-metrics
      rewrite:
        - regexp:
            source: "password"
            target: "API_KEY"
