---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name shortlist-secret
spec:
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  refreshInterval: 5m
  target:
    name: *name
    template:
      data:
        TMDB_APIKEY: "{{ .KOMETA_TMDB_API_KEY }}"
        TAUTULLI_APIKEY: "{{ .TAUTULLI_API_KEY }}"
  dataFrom:
    - extract:
        key: kometa
      rewrite:
        - regexp:
            source: "(.*)"
            target: "KOMETA_$1"

    - extract:
        key: tautulli
      rewrite:
        - regexp:
            source: "(.*)"
            target: "TAUTULLI_$1"
