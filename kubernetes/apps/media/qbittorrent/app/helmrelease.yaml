---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qbittorrent
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn:
    - name: generic-device-plugin
      namespace: kube-system
    - name: openebs
      namespace: openebs-system
    - name: volsync
      namespace: volsync-system

  values:
    controllers:
      qbittorrent:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            nameOverride: *app
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.3@sha256:4fcf15b7f265c2c8d7bc2a7e13240a07e0593c326f3cf3b5b9bb69eec5b79299
            env:
              UMASK: "022"
              QBT_WEBUI_PORT: &port 80
              QBT_TORRENTING_PORT: &BT-port 48531
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/app/version
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 60
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/app/version
                    port: *port
                  timeoutSeconds: 5
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

          # vuetorrent:
          #   dependsOn: app
          #   image:
          #     repository: registry.k8s.io/git-sync/git-sync
          #     tag: v4.4.2
          #   args:
          #     - --repo=https://github.com/WDaan/VueTorrent
          #     - --ref=latest-release
          #     - --period=86400s
          #     - --root=/addons
          #   resources:
          #     requests:
          #       cpu: 10m
          #       memory: 25Mi

          mamapi:
            dependsOn: app
            image:
              repository: ghcr.io/elforkhead/mamapi
              tag: v2.1.2@sha256:9403628e9c0e773c04bb640743105bdbfca53423033828e13d3f5efc79370493
            env:
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: qbittorrent-secret

        initContainers:
          # Scrub ALL of eth0's IPv6 state before gluetun starts: the pod has
          # no global IPv6, but gluetun's IsIPv6Supported() dumps routes from
          # every table (main AND local), so the kernel's link-local address
          # entry and multicast ff00::/8 route each count as "IPv6 supported"
          # and keep the server's unreachable IPv6 endpoints in the reconnect
          # pool — roughly half of all reconnect attempts then stall ~6.5s
          # each, stretching brief tunnel blips into multi-minute outages that
          # trip the liveness probe. Detection runs once at gluetun startup
          # (cmd/gluetun/main.go:248 in v3.41.1), before tun0 exists, so
          # cleaning eth0 here is sufficient. Runs before gluetun (map keys
          # render alphabetically) and exits.
          disable-ipv6:
            image: &gluetun-image
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.1
            command:
              - /bin/sh
              - -c
              - |
                ip -6 addr flush dev eth0
                ip -6 route flush dev eth0 table main
                ip -6 route del multicast ff00::/8 dev eth0 table local
                ip -6 route show table all
                true
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
              allowPrivilegeEscalation: false
          gluetun:
            image: *gluetun-image
            env:
              DNS_ADDRESS: "10.96.0.10"
              DOT: "off"
              FIREWALL_INPUT_PORTS: 80,8388,9999
              FIREWALL_OUTBOUND_SUBNETS: 10.69.0.0/16,10.96.0.0/16
              FIREWALL_VPN_INPUT_PORTS: *BT-port
              HEALTH_SERVER_ADDRESS: :9999
              HEALTH_TARGET_ADDRESS: cloudflare.com:443
              VPN_TYPE: wireguard
              VPN_INTERFACE: tun0
              VPN_SERVICE_PROVIDER: airvpn
              WIREGUARD_MTU: 1420
              # Pin to Stockholm servers sharing one prefix/ASN to keep MAM's
              # ASN-locked session stable. SERVER_COUNTRIES=Sweden randomly
              # rotated between Stockholm hosters with different ASNs, which
              # triggered MAM session invalidations every few weeks. Lupus and
              # Ain both sit in 128.127.104.0/23 under AS51430 (AltusHost, as
              # of July 2026 — the pin predates AirVPN consolidating Stockholm
              # under AltusHost), so failover between them keeps the same ASN;
              # mamapi absorbs the exit-IP change. Ain was added after a
              # Lupus-only outage took torrenting down entirely (2026-07-15).
              # NOTE: these are AirVPN server_names → SERVER_NAMES, NOT
              # SERVER_HOSTNAMES (AirVPN has no hostname filter; that broke startup).
              SERVER_NAMES: Lupus,Ain,Norma,Segin
            envFrom:
              - secretRef:
                  name: qbittorrent-secret
            probes:
              # Loose liveness: gluetun self-heals the tunnel internally every
              # ~6s, so a kubelet kill never fixes a down VPN server — it only
              # tears down tun0 and adds ~2min of startup churn. Keep the probe
              # solely as process-deadlock protection (300s tolerance).
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  timeoutSeconds: 10
                  periodSeconds: 30
                  failureThreshold: 10
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 30
            restartPolicy: Always
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
              allowPrivilegeEscalation: false
            lifecycle:
              postStart:
                exec:
                  command:
                    [
                      "/bin/sh",
                      "-c",
                      "(ip rule del table 51820; ip -6 rule del table 51820) || true",
                    ]
            resources:
              limits:
                kernel.org/tun: 1

          # TODO: Replace once gluetun supports socks5, nothing supports shadowsocks
          socks5:
            restartPolicy: Always
            image:
              repository: serjs/go-socks5-proxy
              tag: latest@sha256:0af522996f402c03ecd985a87997158eabeb28935365e3a384df37eafcf740ea
            env:
              PROXY_PORT: &proxy-port 8388
              REQUIRE_AUTH: "false"

    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: "OnRootMismatch"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/low-memory
                    operator: DoesNotExist

    service:
      app:
        forceRename: *app
        controller: *app
        ports:
          http:
            port: *port

      gluetun:
        suffix: gluetun
        controller: *app
        ports:
          socks-proxy:
            enabled: true
            port: *proxy-port

    route:
      app:
        hostnames:
          - "qbit.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 80

    persistence:
      config:
        existingClaim: *app
        advancedMounts:
          qbittorrent:
            app:
              - path: /config
            mamapi:
              - path: /data
                subPath: mamapi

      media:
        type: nfs
        server: ${TRUENAS_IP}
        path: /mnt/rust/data/torrents
        advancedMounts:
          qbittorrent:
            app:
              - path: /data/torrents

      addons:
        existingClaim: qbittorrent-addons
