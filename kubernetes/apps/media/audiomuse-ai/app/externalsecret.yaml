---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: audiomuse-pg
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audiomuse
spec:
  # Password is generated once and must stay stable for the DB user; do not refresh.
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: audiomuse-secret
    template:
      data:
        POSTGRES_USER: &dbuser audiomuse
        POSTGRES_PASSWORD: &dbpass "{{ .DB_PASSWORD }}"
        POSTGRES_DB: &dbname audiomusedb
        POSTGRES_HOST: &dbhost postgres16-rw.database.svc.cluster.local
        POSTGRES_PORT: "5432"
        REDIS_URL: "redis://dragonfly.database.svc.cluster.local:6379/8"
        INIT_POSTGRES_DBNAME: *dbname
        INIT_POSTGRES_HOST: *dbhost
        INIT_POSTGRES_USER: *dbuser
        INIT_POSTGRES_PASS: *dbpass
        INIT_POSTGRES_SUPER_PASS: "{{ .CNPG_SUPER_PASS }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: audiomuse-pg
      rewrite:
        - regexp:
            source: "password"
            target: "DB_PASSWORD"
    - extract:
        key: cloudnative-pg
      rewrite:
        - regexp:
            source: "(.*)"
            target: "CNPG_$1"
