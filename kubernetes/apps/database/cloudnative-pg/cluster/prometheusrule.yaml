---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg-rules
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: cloudnative-pg.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: Pod {{ $labels.pod }} has been waiting for longer than 5 minutes
            summary: If a backend is waiting for longer than 5 minutes
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 1m
          labels:
            severity: warning
        - alert: PGDatabase
          annotations:
            description: Over 150,000,000 transactions from frozen xid on pod {{ $labels.pod }}
            summary: Number of transactions from the frozen XID to the current one
          expr: |-
            cnpg_pg_database_xid_age > 150000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: Standby is lagging behind by over 300 seconds (5 minutes)
            summary: The standby is lagging behind the primary
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}
            summary: Checks the last time archiving failed. Will be < 0 when it has not failed.
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 1m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: There are over 10 deadlock conflicts in {{ $labels.pod }}
            summary: Checks the number of database conflicts
          expr: |-
            cnpg_pg_stat_database_deadlocks > 10
          for: 1m
          labels:
            severity: warning
        - alert: CNPGBackupStale
          annotations:
            description: No successful CloudNative-PG backup in over 36h for cluster {{ $labels.cluster }} (namespace {{ $labels.namespace }}). The Postgres recovery window — including the Nextcloud DB — is going stale.
            summary: CloudNative-PG backup is stale (>36h since last available backup).
          expr: |-
            (time() - max by (cluster, namespace) (cnpg_collector_last_available_backup_timestamp{namespace="database"})) > 129600
          for: 1h
          labels:
            severity: warning
        - alert: CNPGBackupFailed
          annotations:
            description: The most recent CloudNative-PG backup FAILED (last failed timestamp is newer than last available) for cluster {{ $labels.cluster }} (namespace {{ $labels.namespace }}).
            summary: CloudNative-PG last backup failed.
          expr: |-
            (max by (cluster, namespace) (cnpg_collector_last_failed_backup_timestamp{namespace="database"}) > max by (cluster, namespace) (cnpg_collector_last_available_backup_timestamp{namespace="database"}))
          for: 1h
          labels:
            severity: warning
