---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  path: ./kubernetes/apps
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - name: cluster-settings
        kind: ConfigMap
        optional: false
      - name: cluster-secrets
        kind: Secret
        optional: false
  patches:
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          decryption:
            provider: sops
            secretRef:
              name: sops-age
          postBuild:
            substituteFrom:
              - name: cluster-settings
                kind: ConfigMap
                optional: false
              - name: cluster-secrets
                kind: Secret
                optional: false
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        labelSelector: substitution.flux.home.arpa/disabled notin (true)
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          patches:
            - target:
                group: helm.toolkit.fluxcd.io
                version: v2
                kind: HelmRelease
              patch: |-
                - op: add
                  path: /spec/maxHistory
                  value: 2
      target:
        group: kustomize.toolkit.fluxcd.io
        version: v1
        kind: Kustomization
    # Preserve Minecraft's bootstrap patch; spec.patches is replaced as a list.
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: minecraft
          namespace: game
        spec:
          patches:
            - target:
                group: helm.toolkit.fluxcd.io
                version: v2
                kind: HelmRelease
              patch: |-
                - op: add
                  path: /spec/maxHistory
                  value: 2
            - target:
                kind: PersistentVolumeClaim
                name: minecraft
              patch: |-
                apiVersion: v1
                kind: PersistentVolumeClaim
                metadata:
                  name: minecraft
                spec:
                  dataSourceRef: null
      target:
        group: kustomize.toolkit.fluxcd.io
        version: v1
        kind: Kustomization
        namespace: game
        name: minecraft
