# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/v1.14.2/pkg/machinery/config/schemas/config.schema.json
---
version: v1alpha1
debug: false

machine:
  token: op://talos/talos/MACHINE_TOKEN
  ca:
    crt: op://talos/talos/MACHINE_CA_CRT
    key: op://talos/talos/MACHINE_CA_KEY
  certSANs:
    - 192.168.10.80
    - 127.0.0.1
  logging:
    destinations:
      - endpoint: tcp://192.168.10.122:6051/
        format: json_lines
  features:
    rbac: true
    apidCheckExtKeyUsage: true
    diskQuotaSupport: true

cluster:
  controlPlane:
    endpoint: https://192.168.10.80:6443
  clusterName: main
  token: op://talos/talos/CLUSTER_TOKEN
  ca:
    crt: op://talos/talos/CLUSTER_CA_CRT
    key: op://talos/talos/CLUSTER_CA_KEY
  aggregatorCA:
    crt: op://talos/talos/CLUSTER_AGGREGATORCA_CRT
    key: op://talos/talos/CLUSTER_AGGREGATORCA_KEY
  serviceAccount:
    key: op://talos/talos/CLUSTER_SERVICEACCOUNT_KEY
  etcd:
    ca:
      crt: op://talos/talos/CLUSTER_ETCD_CA_CRT
      key: op://talos/talos/CLUSTER_ETCD_CA_KEY
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 192.168.10.0/24
---
apiVersion: v1alpha1
kind: KmsgLogConfig
name: remote-log
url: tcp://192.168.10.122:6050/
---
apiVersion: v1alpha1
kind: DiscoveryServiceConfig
name: default
endpoint: https://discovery.talos.dev/
---
apiVersion: v1alpha1
kind: DiscoveryIdentityConfig
clusterID: op://talos/talos/CLUSTER_ID
clusterSecret: op://talos/talos/CLUSTER_SECRET
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 1.1.1.1
  - address: 1.0.0.1
searchDomains:
  domains: []
  disableDefault: true
hostDNS:
  enabled: true
  forwardKubeDNSToHost: false
  resolveMemberNames: true
---
apiVersion: v1alpha1
kind: KubeletConfig
image: "ghcr.io/siderolabs/kubelet:${KUBERNETES_VERSION}"
extraArgs:
  feature-gates: DynamicResourceAllocation=true
config:
  maxPods: 150
  serializeImagePulls: false
  featureGates:
    DynamicResourceAllocation: true
defaultRuntimeSeccompProfileEnabled: true
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 192.168.10.0/24
labels:
  node-role.kubernetes.io/control-plane: ""
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-hostpath
volumeType: directory
mount:
  secure: false
---
apiVersion: v1alpha1
kind: KubePrismConfig
port: 7445
---
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
  - os:admin
allowedKubernetesNamespaces:
  - kube-system
  - actions-runner-system
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  fs.inotify.max_queued_events: "65536"
  fs.inotify.max_user_instances: "8192"
  fs.inotify.max_user_watches: "1048576"
  net.core.bpf_jit_harden: "1"
  net.core.default_qdisc: fq
  net.core.rmem_max: "134217728"
  net.core.wmem_max: "134217728"
  net.core.rmem_default: "134217728"
  net.core.wmem_default: "134217728"
  net.core.optmem_max: "134217728"
  net.core.netdev_max_backlog: "500000"
  net.ipv4.tcp_timestamps: "0"
  net.ipv4.tcp_congestion_control: bbr
  net.ipv4.tcp_fastopen: "3"
  net.ipv4.tcp_max_syn_backlog: "8192"
  net.ipv4.tcp_rmem: 4096 524288 134217728
  net.ipv4.tcp_wmem: 4096 524288 134217728
  net.ipv4.tcp_mtu_probing: "1"
  net.ipv4.tcp_window_scaling: "1"
  sunrpc.tcp_slot_table_entries: "128"
  sunrpc.tcp_max_slot_table_entries: "128"
  user.max_user_namespaces: "11255"
  vm.nr_hugepages: "1024"
---
apiVersion: v1alpha1
kind: SysfsConfig
params:
  devices.system.cpu.intel_pstate.hwp_dynamic_boost: "1"
---
apiVersion: v1alpha1
kind: UdevRulesConfig
rules:
  - SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="44", MODE="0660"
---
apiVersion: v1alpha1
kind: EtcFileConfig
name: nfsmount.conf
mode: 0o644
contents: |
  [ NFSMount_Global_Options ]
  hard=True
  nconnect=16
  noatime=True
---
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: spegel-cdi
content: |
  [plugins."io.containerd.cri.v1.images"]
    discard_unpacked_layers = false
  [plugins."io.containerd.cri.v1.runtime"]
    cdi_spec_dirs = ["/var/cdi/static", "/var/cdi/dynamic"]
    device_ownership_from_security_context = true
---
apiVersion: v1alpha1
kind: KubeNetworkConfig
dnsDomain: cluster.local
podSubnets:
  - 10.69.0.0/16
serviceSubnets:
  - 10.96.0.0/16
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
image: "registry.k8s.io/kube-apiserver:${KUBERNETES_VERSION}"
extraArgs:
  enable-aggregator-routing: "true"
  feature-gates: ImageVolume=true,MutatingAdmissionPolicy=true
  runtime-config: admissionregistration.k8s.io/v1beta1=true
certExtraSANs:
  - 192.168.10.80
  - 127.0.0.1
---
apiVersion: v1alpha1
kind: KubeAuthenticationConfig
configuration:
  anonymous:
    enabled: true
    conditions:
      - path: /livez
      - path: /readyz
      - path: /healthz
  jwt: []
---
apiVersion: v1alpha1
kind: KubeAuthorizerConfig
name: node
type: Node
---
apiVersion: v1alpha1
kind: KubeAuthorizerConfig
name: rbac
type: RBAC
---
apiVersion: v1alpha1
kind: KubeAuditPolicyConfig
configuration:
  apiVersion: audit.k8s.io/v1
  kind: Policy
  rules:
    - level: Metadata
---
apiVersion: v1alpha1
kind: KubeEtcdEncryptionConfig
config:
  resources:
    - resources:
        - secrets
      providers:
        - secretbox:
            keys:
              - name: key2
                secret: op://talos/talos/CLUSTER_SECRETBOXENCRYPTIONSECRET
        - identity: {}
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
image: "registry.k8s.io/kube-controller-manager:${KUBERNETES_VERSION}"
extraArgs:
  bind-address: 0.0.0.0
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
image: "registry.k8s.io/kube-scheduler:${KUBERNETES_VERSION}"
extraArgs:
  bind-address: 0.0.0.0
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
