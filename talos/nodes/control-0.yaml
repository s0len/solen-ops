# Node: control-0
# IP: 192.168.10.40
# Hardware: Intel 12th gen, Intel GPU, SSD storage
---
machine:
  type: controlplane
  # Dedicated SSD for etcd to reduce I/O contention
  disks:
    - device: /dev/disk/by-id/ata-KINGSTON_SV300S37A240G_50026B786500A926
      partitions:
        - mountpoint: /var/lib/etcd
  network:
    interfaces:
      - interface: enp2s0
        mtu: 1500
        addresses:
          - 192.168.10.40/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.10.1
        vip:
          ip: 192.168.10.80
        vlans:
          - vlanId: 20
            dhcp: false
            addresses:
              - 192.168.20.40/24
      - interface: enp1s0f1
        dhcp: false
  nodeLabels:
    intel.feature.node.kubernetes.io/gpu: "true"
    topology.kubernetes.io/zone: zone-a
    node.kubernetes.io/storage: ceph
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: disk.serial == 'S5GXNF1R887620N'
  grow: true
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: control-0
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: "factory.talos.dev/metal-installer/${TALOS_SCHEMATIC}:${TALOS_VERSION}"
provisioning:
  diskSelector:
    match: glob("*SSD 870*", disk.model)
  wipe: false
