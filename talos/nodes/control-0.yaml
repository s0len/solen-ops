# Node: control-0
# IP: 192.168.10.40
# Hardware: Intel 12th gen, Intel GPU, SSD storage
---
machine:
  type: controlplane
  # Dedicated SSD for etcd to reduce I/O contention
  disks:
    - device: /dev/disk/by-id/ata-KINGSTON_SV300S37A240G_50026B786500A926
      partitions:
        - mountpoint: /var/lib/etcd
---
apiVersion: v1alpha1
kind: LinkConfig
name: enp2s0
mtu: 1500
addresses:
  - address: 192.168.10.40/24
routes:
  - gateway: 192.168.10.1
    metric: 1024
---
apiVersion: v1alpha1
kind: VLANConfig
name: enp2s0.20
vlanID: 20
parent: enp2s0
addresses:
  - address: 192.168.20.40/24
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.10.80
link: enp2s0
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  intel.feature.node.kubernetes.io/gpu: "true"
  topology.kubernetes.io/zone: zone-a
  node.kubernetes.io/storage: ceph
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: disk.serial == 'S5GXNF1R887620N'
  grow: true
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: control-0
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: "factory.talos.dev/metal-installer/${TALOS_SCHEMATIC}:${TALOS_VERSION}"
provisioning:
  diskSelector:
    match: glob("*SSD 870*", disk.model)
  wipe: false
