---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Gate Tests

on:
  pull_request:
    branches: ["main"]
    paths: ["kubernetes/apps/observability/alert-agent/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Gate Tests - Unittest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Run Gate tests
        run: python3 -m unittest discover -s kubernetes/apps/observability/alert-agent/tests -v
